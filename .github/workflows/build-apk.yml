name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Materialize signing material from secrets
        env:
          FZ_KEYSTORE_BASE64: ${{ secrets.FZ_KEYSTORE_BASE64 }}
          FZ_KEYSTORE_PROPERTIES: ${{ secrets.FZ_KEYSTORE_PROPERTIES }}
        run: |
          echo "$FZ_KEYSTORE_BASE64" | base64 --decode > android/app/fz-release.jks
          printf '%s' "$FZ_KEYSTORE_PROPERTIES" > android/app/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Resolve version
        id: ver
        run: |
          V="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      - name: Verify and rename the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK/build-tools"/*/apksigner 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" || { echo "::error::APK signature verification FAILED - package would be invalid"; exit 1; }
          echo "APK signature verified OK"
          NAME="FZ Manager ${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "FZ Manager ${{ steps.ver.outputs.tag }}.apk"
          sha256sum "$NAME" > "FZ Manager ${{ steps.ver.outputs.tag }}.sha256"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
        id: apk

      - uses: actions/upload-artifact@v4
        with:
          name: FZ-Manager-apk
          path: |
            FZ Manager *.apk
            FZ Manager *.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FZ Manager ${{ steps.ver.outputs.tag }}
          body: |
            FZ Manager — файловый менеджер нового поколения для Android (Flutter + Root + ИИ).

            ### Что нового в v1.4.0
            - **ИИ Мозг: надёжный провайдер** — нативные OpenAI tool_calls, поддержка reasoning/thinking-моделей (reasoning_content), авто-ретрай без tools при 400, человекочитаемые ошибки 401/403/404/429/5xx, кнопка «Проверить связь»
            - **Физзи: переключение режимов прямо в чате** — База знаний / Онлайн / Локальная модель; контекст диалога; RAG
            - **«Рекомендованные локальные ИИ»** — анализ RAM/CPU/ядер/модели телефона + HEAD-проверка реальных файлов на HuggingFace; 7 проверенных GGUF-моделей (SmolLM2-135M, Qwen2.5-0.5B, Llama-3.2-1B, Gemma-3-1B); инференс на телефоне не запускается — ноль лишней нагрузки
            - **Мощный Root-зонд** — Magisk/KernelSU/APatch/SuperSU определяются даже без выданного su (больше никакого "unknown"); в Настройках — статус root, су-бинарники, тест записи, глубокий зонд
            - **Корневой раздел в «Файлах»** — кнопка доступа к root-ФС прямо из файлового браузера
            - **Медиаплеер**: mp3, m4a, aac, wav, ogg, opus, flac + mp4, mov, webm, mkv — анимированный аудиоплеер и видеоплеер со скрабом
            - **Liquid Glass докбар** — настоящий блюр, блик, «капелька»-индикатор с покачиванием; компактнее; Root/Ядро переехали в «Ещё»
            - **Скрытые системные промпты** ИИ Мозга и Физзи (проявляются только в Настройки → Продвинутые)
            - Плавные анимации: fade+slide смены вкладок, анимированные размеры, spring-эффекты

            ### Установить
            Скачайте `FZ Manager v1.4.0.apk` → разрешите «неизвестные источники» → установите. Контрольная сумма — `.sha256`.
          files: |
            FZ Manager *.apk
            FZ Manager *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
