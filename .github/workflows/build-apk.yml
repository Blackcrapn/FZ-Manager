name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Materialize signing material from secrets
        env:
          FZ_KEYSTORE_BASE64: ${{ secrets.FZ_KEYSTORE_BASE64 }}
          FZ_KEYSTORE_PROPERTIES: ${{ secrets.FZ_KEYSTORE_PROPERTIES }}
        run: |
          echo "$FZ_KEYSTORE_BASE64" | base64 --decode > android/app/fz-release.jks
          printf '%s' "$FZ_KEYSTORE_PROPERTIES" > android/app/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - name: Verify APK is properly signed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools"
          APKSIGNER="$(ls -1 "$BT"/*/apksigner 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" || { echo "::error::APK signature verification FAILED - package would be invalid"; exit 1; }
          echo "APK signature verified OK"

      - name: Compute SHA256
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$APK" | tee app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fz-manager-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            app-release.apk.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: FZ Manager v1.2.0
          body: |
            FZ Manager — файловый менеджер нового поколения.

            ### Что нового в v1.2.0 — полный редизайн
            - Приложение само запрашивает разрешения: страница «Все файлы» открывается из приложения (онбординг и настройки)
            - Полный редизайн: GlassCard, градиентные заголовки, hero-арт, пустые состояния, новые иконки типов файлов
            - Файлы: просмотр изображений (зум), текстовых файлов; «Открыть как Root» для недоступных файлов; запуск .sh через Root с подтверждением и выводом
            - Физзи полностью переписан: 15+ тем, FAQ, пошаговые гайды, советы, smalltalk — сотни строк знаний
            - Новые ассеты: аватар Физзи 1024px, hero-баннеры, empty-state арт
            - Настройки: акцентные цвета с выбором, плитки в стиле glass, страница разрешений

            ### Основное
            - Умный поиск путей с автодополнением и автоисправлением (/data/lokal → /data/local)
            - Root-навигация по системным файлам (su)
            - ИИ Мозг: реальный агент, кастомный провайдер, инструменты + create_tool
            - Персистентность, корзина с восстановлением, кастомизация

            SHA256: см. файл app-release.apk.sha256
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
