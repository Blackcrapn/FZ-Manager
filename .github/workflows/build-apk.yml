name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fz-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FZ Manager v1.0.0
          body: |
            FZ Manager — файловый менеджер нового поколения.

            - Умный поиск путей с автодополнением и исправлением (mojibake RU исправлен)
            - Root-раздел с навигацией по системным файлам (через su)
            - ИИ Мозг: реальный агент с инструментами, чат, кастомный провайдер
            - Персистентность настроек (тема, язык, избранное, закладки)
            - Обучение с Физзи, корзина с восстановлением, кастомизация
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
