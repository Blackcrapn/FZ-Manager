name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Materialize signing material from secrets
        env:
          FZ_KEYSTORE_BASE64: ${{ secrets.FZ_KEYSTORE_BASE64 }}
          FZ_KEYSTORE_PROPERTIES: ${{ secrets.FZ_KEYSTORE_PROPERTIES }}
        run: |
          echo "$FZ_KEYSTORE_BASE64" | base64 --decode > android/app/fz-release.jks
          printf '%s' "$FZ_KEYSTORE_PROPERTIES" > android/app/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Resolve version
        id: ver
        run: |
          V="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      - name: Verify and rename the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK/build-tools"/*/apksigner 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" || { echo "::error::APK signature verification FAILED - package would be invalid"; exit 1; }
          echo "APK signature verified OK"
          NAME="FZ Manager ${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "FZ Manager ${{ steps.ver.outputs.tag }}.apk"
          sha256sum "$NAME" > "FZ Manager ${{ steps.ver.outputs.tag }}.sha256"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
        id: apk

      - uses: actions/upload-artifact@v4
        with:
          name: FZ-Manager-apk
          path: |
            FZ Manager *.apk
            FZ Manager *.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FZ Manager ${{ steps.ver.outputs.tag }}
          body: |
            FZ Manager — файловый менеджер нового поколения для Android (Flutter + Root + ИИ).

            ### Что нового
            - **ИИ Мозг: полноценные чаты** — отдельные чаты с историей, контекстом (последние 40 реплик в запросе), локальным сохранением, удалением
            - **API-ключ** корректно сохраняется в Android Keystore и читается при запросах (исправлена ошибка 401 «ключ не сохраняется»)
            - **Физзи 2.0** — контекст диалога («подробнее», «как это включить»), онлайн-режим через вашего провайдера с RAG по базе знаний, системный промпт (редактируется), кнопка скачивания **мини-модели SmolLM2-135M (≈130 МБ)** для телефонов
            - **Раздел «Ядро»** рядом с файлами — uname, cpuinfo, meminfo, dmesg, mounts + просмотр ядровых файлов через root
            - **Liquid Glass докбар** — стеклянный док с блюром, анимированным индикатором и подписями
            - **Музыкальный островок** — live-уведомление «♪ играет музыку» (AudioManager) для устройств с dynamic island; запрос разрешения на уведомления из приложения
            - **Приложение само запрашивает разрешения** (медиа, уведомления, страница «Все файлы»)
            - Исправлены «непонятные символы» в разделах Обзор и Root; полный редизайн интерфейса

            ### Файл
            - `FZ Manager vX.Y.Z.apk` — подписанный релизный APK (v1+v2+v3 схемы, верифицирован apksigner в CI)
            - `.sha256` — контрольная сумма

            ### Установить
            Скачайте APK → разрешите «неизвестные источники» → установите. Для root-функций нужен root (Magisk/Superuser).
          files: |
            FZ Manager *.apk
            FZ Manager *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
